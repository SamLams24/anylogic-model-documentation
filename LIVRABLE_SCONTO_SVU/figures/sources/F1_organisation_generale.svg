<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222222"/>
    </marker>
    <marker id="arrowgrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="750" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">SCONTO-SVU : organisation générale du Core et des extensions retenues</text>
  <text x="750" y="58" text-anchor="middle" font-size="13" font-style="italic" fill="#444444">Figure inspirée de « SCONTO organization » (Vegetti et al.) — périmètre scientifique du chapitre 3/4. Extension AHP exclue, non représentée.</text>

  <!-- Third-party SCONTO ontologies group -->
  <rect x="540" y="86" width="420" height="120" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="750" y="104" text-anchor="middle" font-size="12.5" fill="#555555">Ontologies SCONTO tierces (2014, non modifiées)</text>

  <rect x="565" y="118" width="110" height="42" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="620" y="144" text-anchor="middle" font-size="14" font-weight="bold">SCOBE</text>

  <rect x="695" y="118" width="110" height="42" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="144" text-anchor="middle" font-size="14" font-weight="bold">SCOME</text>

  <rect x="825" y="118" width="110" height="42" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="880" y="144" text-anchor="middle" font-size="14" font-weight="bold">SCOPRO</text>

  <line x1="675" y1="139" x2="693" y2="139" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="805" y1="139" x2="823" y2="139" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="684" y="132" text-anchor="middle" font-size="9.5" fill="#555555">imports</text>
  <text x="814" y="132" text-anchor="middle" font-size="9.5" fill="#555555">imports</text>

  <!-- arrow group -> Core -->
  <line x1="750" y1="206" x2="750" y2="258" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="762" y="235" font-size="11.5" fill="#333333">owl:imports</text>
  <text x="762" y="248" font-size="11.5" fill="#333333">(SCOPRO, SCOME, SCOBE)</text>

  <!-- Core box -->
  <rect x="590" y="260" width="320" height="92" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
  <text x="750" y="292" text-anchor="middle" font-size="18" font-weight="bold">Core SCONTO-SVU</text>
  <text x="750" y="314" text-anchor="middle" font-size="14">v4.3.0</text>
  <text x="750" y="334" text-anchor="middle" font-size="11.5" fill="#444444">ligne courante — 0 classe insatisfaisable (HermiT)</text>

  <!-- arrows Core -> Agent / AER -->
  <line x1="690" y1="352" x2="570" y2="418" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="352" x2="950" y2="418" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="590" y="392" font-size="11.5" fill="#333333">owl:imports</text>
  <text x="900" y="392" font-size="11.5" fill="#333333">owl:imports</text>

  <!-- Agent box -->
  <rect x="440" y="420" width="260" height="78" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="570" y="450" text-anchor="middle" font-size="15.5" font-weight="bold">Agent Extension</text>
  <text x="570" y="470" text-anchor="middle" font-size="13">v1.1.2</text>
  <text x="570" y="487" text-anchor="middle" font-size="10.5" fill="#444444">revalidée avec le Core 4.3.0</text>

  <!-- AER box -->
  <rect x="800" y="420" width="260" height="78" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="930" y="450" text-anchor="middle" font-size="15.5" font-weight="bold">AER Extension</text>
  <text x="930" y="470" text-anchor="middle" font-size="13">v1.1.2</text>
  <text x="930" y="487" text-anchor="middle" font-size="10.5" fill="#444444">revalidée avec le Core 4.3.0</text>

  <!-- Agent -> AER -->
  <line x1="700" y1="459" x2="798" y2="459" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="749" y="450" text-anchor="middle" font-size="10.5" fill="#333333">owl:imports</text>

  <!-- Older generation zone -->
  <rect x="60" y="580" width="640" height="340" rx="10" fill="#fafafa" stroke="#888888" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="90" y="608" font-size="13.5" font-weight="bold" fill="#555555">Génération antérieure — non revalidée avec la ligne courante</text>
  <text x="90" y="626" font-size="11" fill="#666666">(absence d'alignement et de validation constatée ; aucun test de cohérence conjoint</text>
  <text x="90" y="641" font-size="11" fill="#666666">avec le Core 4.3.0 n'a été réalisé — aucune incompatibilité logique n'est affirmée)</text>

  <rect x="150" y="660" width="460" height="60" rx="6" fill="#e8e8e8" stroke="#777777" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="684" text-anchor="middle" font-size="13" fill="#444444">Core v4.1.0 + Agent v1.0.0 + AER v1.0.0</text>
  <text x="380" y="702" text-anchor="middle" font-size="10.5" fill="#666666">(version importée, génération antérieure à la ligne courante)</text>

  <!-- Forecast/MTS box -->
  <rect x="90" y="770" width="250" height="78" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.8"/>
  <text x="215" y="800" text-anchor="middle" font-size="15" font-weight="bold">Forecast / MTS</text>
  <text x="215" y="820" text-anchor="middle" font-size="12.5">v1.0.0</text>
  <text x="215" y="837" text-anchor="middle" font-size="10" fill="#555555">chapitre expérimental</text>

  <!-- ISA-95 box -->
  <rect x="400" y="770" width="210" height="78" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="1.8"/>
  <text x="505" y="800" text-anchor="middle" font-size="15" font-weight="bold">ISA-95</text>
  <text x="505" y="820" text-anchor="middle" font-size="12.5">v1.0.0</text>
  <text x="505" y="837" text-anchor="middle" font-size="10" fill="#555555">chapitre 4</text>

  <line x1="230" y1="768" x2="330" y2="722" stroke="#555555" stroke-width="1.6" marker-end="url(#arrowgrey)"/>
  <line x1="480" y1="768" x2="420" y2="722" stroke="#555555" stroke-width="1.6" marker-end="url(#arrowgrey)"/>
  <text x="250" y="745" font-size="10" fill="#555555">owl:imports</text>
  <text x="430" y="745" font-size="10" fill="#555555">owl:imports (Core seul)</text>

  <!-- Legend -->
  <rect x="760" y="580" width="650" height="340" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="785" y="608" font-size="14" font-weight="bold" fill="#111111">Légende</text>

  <line x1="785" y1="630" x2="825" y2="630" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="835" y="634" font-size="12">owl:imports (relation vérifiée dans le fichier)</text>

  <rect x="785" y="650" width="34" height="20" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="835" y="665" font-size="12">composant de la ligne courante (Core 4.3.0, Agent/AER 1.1.2)</text>

  <rect x="785" y="680" width="34" height="20" fill="#e8e8e8" stroke="#777777" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="835" y="695" font-size="12">génération antérieure, non revalidée (Core 4.1.0 / Agent 1.0.0)</text>

  <text x="785" y="725" font-size="12.5" font-weight="bold" fill="#111111">Note de périmètre</text>
  <text x="785" y="745" font-size="11.5" fill="#333333">— L'extension AHP est exclue du périmètre scientifique du</text>
  <text x="785" y="761" font-size="11.5" fill="#333333">  manuscrit sur instruction de l'encadrement ; elle n'est</text>
  <text x="785" y="777" font-size="11.5" fill="#333333">  pas représentée ici, bien que ses artefacts techniques</text>
  <text x="785" y="793" font-size="11.5" fill="#333333">  restent conservés hors publication.</text>

  <text x="785" y="823" font-size="12.5" font-weight="bold" fill="#111111">Lecture des dépendances</text>
  <text x="785" y="843" font-size="11.5" fill="#333333">— Les flèches représentent des déclarations owl:imports</text>
  <text x="785" y="859" font-size="11.5" fill="#333333">  lues directement dans chaque fichier, pas une évaluation</text>
  <text x="785" y="875" font-size="11.5" fill="#333333">  de compatibilité logique entre versions.</text>
  <text x="785" y="895" font-size="11.5" fill="#333333">— Aucune figure ne représente de cardinalité UML : aucune</text>
  <text x="785" y="911" font-size="11.5" fill="#333333">  restriction numérique (owl:cardinality) n'est déclarée dans</text>
  <text x="785" y="927" font-size="11.5" fill="#333333">  ces ontologies (voir registre_figures.md).</text>

  <text x="750" y="975" text-anchor="middle" font-size="10.5" fill="#777777">Sources : SCONTO_SVU_Core_v4.3.0.ttl ; SCONTO_VSM_Agent_Extension_v1.1.2.ttl ; SCONTO_VSM_AER_Extension_v1.1.2.ttl ;</text>
  <text x="750" y="990" text-anchor="middle" font-size="10.5" fill="#777777">sconto-vsm-forecast-mts-extension_1.ttl ; sconto-vsm-isa95-extension-v1.0.ttl ; SCOPRO.owl ; SCOME.owl ; SCOBE.owl</text>
</svg>
