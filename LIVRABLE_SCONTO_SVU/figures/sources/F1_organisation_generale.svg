<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 555" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,2 L0,4 Z" fill="#222222"/>
    </marker>
    <marker id="arrowgrey" markerWidth="7" markerHeight="7" refX="5.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,2 L0,4 Z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="460" height="555" fill="#ffffff"/>

  <!-- Title (kept short; full caption text goes in the LaTeX \caption, not in the drawing) -->
  <text x="230" y="16" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111111">SCONTO-SVU : organisation générale</text>
  <text x="230" y="27" text-anchor="middle" font-size="9" font-style="italic" fill="#444444">Core et extensions scientifiquement retenues</text>

  <!-- Third-party SCONTO ontologies -->
  <rect x="115" y="38" width="230" height="56" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="230" y="49" text-anchor="middle" font-size="8.5" fill="#555555">Ontologies SCONTO tierces (2014)</text>

  <rect x="126" y="56" width="58" height="26" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="155" y="73" text-anchor="middle" font-size="9.7" font-weight="bold">SCOBE</text>

  <rect x="200" y="56" width="58" height="26" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="229" y="73" text-anchor="middle" font-size="9.7" font-weight="bold">SCOME</text>

  <rect x="274" y="56" width="58" height="26" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="303" y="73" text-anchor="middle" font-size="9.7" font-weight="bold">SCOPRO</text>

  <line x1="184" y1="69" x2="198" y2="69" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="258" y1="69" x2="272" y2="69" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- arrow group -> Core -->
  <line x1="230" y1="94" x2="230" y2="116" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="236" y="108" font-size="8.5" fill="#333333">owl:imports</text>

  <!-- Core box -->
  <rect x="135" y="118" width="190" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <text x="230" y="138" text-anchor="middle" font-size="12" font-weight="bold">Core SCONTO-SVU</text>
  <text x="230" y="152" text-anchor="middle" font-size="10">v4.3.0</text>
  <text x="230" y="165" text-anchor="middle" font-size="8" fill="#555555">ligne courante — 0 classe insatisfaisable (HermiT)</text>

  <!-- arrows Core -> Agent / AER -->
  <line x1="195" y1="174" x2="145" y2="213" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="265" y1="174" x2="325" y2="213" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="78" y="190" font-size="8.5" fill="#333333">owl:imports</text>
  <text x="332" y="190" font-size="8.5" fill="#333333">owl:imports</text>

  <!-- Agent box -->
  <rect x="55" y="215" width="160" height="50" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="135" y="233" text-anchor="middle" font-size="10.5" font-weight="bold">Agent Extension</text>
  <text x="135" y="246" text-anchor="middle" font-size="9">v1.1.2</text>
  <text x="135" y="257" text-anchor="middle" font-size="8" fill="#555555">revalidée avec le Core 4.3.0</text>

  <!-- AER box -->
  <rect x="245" y="215" width="160" height="50" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="325" y="233" text-anchor="middle" font-size="10.5" font-weight="bold">AER Extension</text>
  <text x="325" y="246" text-anchor="middle" font-size="9">v1.1.2</text>
  <text x="325" y="257" text-anchor="middle" font-size="8" fill="#555555">revalidée avec le Core 4.3.0</text>

  <!-- Agent -> AER -->
  <line x1="215" y1="238" x2="243" y2="238" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- Older generation zone -->
  <rect x="20" y="300" width="420" height="180" rx="6" fill="#fafafa" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="32" y="316" font-size="9.3" font-weight="bold" fill="#555555">Génération antérieure — non revalidée</text>
  <text x="32" y="328" font-size="8" fill="#666666">(absence d'alignement et de validation constatée ; aucun test de</text>
  <text x="32" y="338" font-size="8" fill="#666666">cohérence conjoint réalisé — aucune incompatibilité affirmée)</text>

  <rect x="90" y="350" width="280" height="38" rx="4" fill="#e8e8e8" stroke="#777777" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="230" y="366" text-anchor="middle" font-size="9" fill="#444444">Core v4.1.0 + Agent v1.0.0 + AER v1.0.0</text>
  <text x="230" y="378" text-anchor="middle" font-size="8" fill="#666666">(version réellement importée)</text>

  <!-- Forecast/MTS box -->
  <rect x="55" y="410" width="160" height="54" rx="5" fill="#f2f2f2" stroke="#555555" stroke-width="1.2"/>
  <text x="135" y="430" text-anchor="middle" font-size="10" font-weight="bold">Forecast / MTS</text>
  <text x="135" y="443" text-anchor="middle" font-size="9">v1.0.0</text>
  <text x="135" y="454" text-anchor="middle" font-size="8" fill="#555555">chapitre expérimental</text>

  <!-- ISA-95 box -->
  <rect x="245" y="410" width="150" height="54" rx="5" fill="#f2f2f2" stroke="#555555" stroke-width="1.2"/>
  <text x="320" y="430" text-anchor="middle" font-size="10" font-weight="bold">ISA-95</text>
  <text x="320" y="443" text-anchor="middle" font-size="9">v1.0.0</text>
  <text x="320" y="454" text-anchor="middle" font-size="8" fill="#555555">chapitre 4</text>

  <line x1="150" y1="408" x2="190" y2="390" stroke="#555555" stroke-width="1.1" marker-end="url(#arrowgrey)"/>
  <line x1="300" y1="408" x2="260" y2="390" stroke="#555555" stroke-width="1.1" marker-end="url(#arrowgrey)"/>
  <text x="60" y="401" font-size="8" fill="#555555">owl:imports</text>
  <text x="305" y="401" font-size="8" fill="#555555">owl:imports (Core seul)</text>

  <!-- Compact legend, details deferred to registre_figures.md -->
  <rect x="20" y="495" width="420" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <line x1="32" y1="512" x2="56" y2="512" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="62" y="515" font-size="8.2">owl:imports (vérifié dans chaque fichier)</text>
  <rect x="230" y="506" width="20" height="12" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="256" y="515" font-size="8.2">ligne courante</text>
  <rect x="320" y="506" width="20" height="12" fill="#e8e8e8" stroke="#777777" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="346" y="515" font-size="8.2">génération antérieure</text>
  <text x="32" y="531" font-size="8" fill="#777777" font-style="italic">Détail des sources, versions et vérifications : registre_figures.md</text>
</svg>
