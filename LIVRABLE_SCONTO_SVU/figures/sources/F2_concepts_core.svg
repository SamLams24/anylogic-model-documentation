<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,2 L0,4 Z" fill="#222222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="460" height="480" fill="#ffffff"/>

  <text x="230" y="16" text-anchor="middle" font-size="12.5" font-weight="bold">SCONTO-SVU : concepts fondamentaux du Core (1/2)</text>
  <text x="230" y="27" text-anchor="middle" font-size="8" font-style="italic" fill="#444444">Bandes 1 à 3 — architecture, réseau logistique, entités opérationnelles, événements bruts (suite : Figure 2c)</text>

  <!-- Bande 1 -->
  <text x="20" y="46" font-size="9" font-weight="bold">Bande 1 — Architecture et réseau logistique</text>
  <rect x="30" y="54" width="130" height="34" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="95" y="68" text-anchor="middle" font-size="8" font-style="italic">«abstract»</text>
  <text x="95" y="80" text-anchor="middle" font-size="9" font-weight="bold" font-style="italic">SC Entity</text>

  <rect x="230" y="54" width="180" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="320" y="75" text-anchor="middle" font-size="10" font-weight="bold">SupplyChainActor</text>

  <line x1="160" y1="71" x2="228" y2="71" stroke="#555555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
  <text x="165" y="65" font-size="8.5" fill="#555555">belongsToActor</text>

  <!-- Bande 2 -->
  <text x="20" y="112" font-size="9" font-weight="bold">Bande 2 — Entités opérationnelles</text>
  <rect x="30" y="120" width="160" height="36" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="110" y="142" text-anchor="middle" font-size="9.5" font-weight="bold">EquipmentElement</text>

  <rect x="210" y="120" width="140" height="36" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="280" y="142" text-anchor="middle" font-size="9.5" font-weight="bold">StorageEntity</text>

  <polyline points="320,88 320,99 110,99 110,118" fill="none" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="325" y="99" font-size="9" fill="#333333">ownsEquipment</text>

  <rect x="30" y="170" width="380" height="30" rx="4" fill="#f7f7f7" stroke="#999999" stroke-width="0.9"/>
  <text x="40" y="182" font-size="8.5" fill="#555555">EquipmentElement et StorageEntity sont des spécialisations indirectes</text>
  <text x="40" y="193" font-size="8.5" fill="#555555">d'ObservableEntity (via PhysicalEntity) — voir matrice des relations.</text>

  <!-- Bande 3 -->
  <text x="20" y="226" font-size="9" font-weight="bold">Bande 3 — Événements bruts</text>
  <rect x="30" y="234" width="130" height="36" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="95" y="256" text-anchor="middle" font-size="9.5" font-weight="bold">RawEvent</text>

  <rect x="230" y="234" width="180" height="36" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="320" y="248" text-anchor="middle" font-size="8" font-style="italic">«abstract»</text>
  <text x="320" y="260" text-anchor="middle" font-size="9.5" font-weight="bold">ObservableEntity</text>

  <line x1="160" y1="252" x2="228" y2="252" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="165" y="246" font-size="9" fill="#333333">generatedBy</text>

  <polyline points="95,234 95,206 14,206 14,140 28,140" fill="none" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="2" y="225" font-size="8.7" fill="#333333" transform="rotate(-90 12,225)">relatedToEquipment</text>

  <text x="30" y="300" font-size="9" font-style="italic" fill="#666666">RawEvent produit les indicateurs VSM (producesIndicator) — suite en Figure 2c.</text>

  <!-- Legend -->
  <rect x="30" y="322" width="400" height="140" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="42" y="340" font-size="9" font-weight="bold">Légende</text>

  <line x1="42" y1="354" x2="66" y2="354" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="72" y="357" font-size="9">propriété (nom exact, Core 4.3.0)</text>

  <line x1="42" y1="370" x2="66" y2="370" stroke="#555555" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
  <text x="72" y="373" font-size="9">propriété générique (domaine scopro:SC_Entity)</text>

  <rect x="42" y="380" width="26" height="16" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="72" y="391" font-size="9">classe abstraite (importée ou interne)</text>

  <rect x="42" y="402" width="26" height="16" fill="#f7f7f7" stroke="#999999" stroke-width="0.9"/>
  <text x="72" y="413" font-size="9">note de traçabilité / renvoi (pas une classe)</text>

  <text x="42" y="434" font-size="9" fill="#333333">Les regroupements en six bandes sont un classement éditorial, distinct des</text>
  <text x="42" y="446" font-size="9" fill="#333333">quatorze modules A-N du fichier Turtle (correspondance : registre_figures.md).</text>

</svg>
