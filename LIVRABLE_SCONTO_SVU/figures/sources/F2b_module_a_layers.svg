<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="isa" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.5,4 L0,8 Z" fill="#ffffff" stroke="#222222" stroke-width="0.9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="460" height="330" fill="#ffffff"/>

  <text x="230" y="16" text-anchor="middle" font-size="13.5" font-weight="bold">Figure 2b — Module A : typologie des couches architecturales</text>
  <text x="230" y="27" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444444">Hiérarchie OWL réelle (rdfs:subClassOf), telle que déclarée dans le Core 4.3.0</text>

  <rect x="155" y="42" width="150" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="230" y="63" text-anchor="middle" font-size="11" font-weight="bold">ArchitectureLayer</text>

  <rect x="20" y="110" width="200" height="40" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="120" y="128" text-anchor="middle" font-size="10.5" font-weight="bold">OperationalDataLayer</text>
  <text x="120" y="141" text-anchor="middle" font-size="9.3" fill="#555555">« Shop-floor / Operational Data Layer »</text>

  <rect x="240" y="110" width="200" height="40" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="340" y="128" text-anchor="middle" font-size="10.5" font-weight="bold">VSMLayer</text>
  <text x="340" y="141" text-anchor="middle" font-size="9.3" fill="#555555">« VSM Observation Layer »</text>

  <rect x="20" y="168" width="200" height="40" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="120" y="186" text-anchor="middle" font-size="10.5" font-weight="bold">SVMLLayer</text>
  <text x="120" y="199" text-anchor="middle" font-size="9.3" fill="#555555">« SVML – SCOR-VSM Mapping Layer »</text>

  <rect x="240" y="168" width="200" height="40" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="340" y="186" text-anchor="middle" font-size="10.5" font-weight="bold">SCORReferenceLayer</text>
  <text x="340" y="199" text-anchor="middle" font-size="9.3" fill="#555555">« SCOR Reference Layer »</text>

  <line x1="120" y1="110" x2="195" y2="78" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <line x1="340" y1="110" x2="265" y2="78" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <line x1="120" y1="168" x2="130" y2="152" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <line x1="340" y1="168" x2="330" y2="152" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>

  <text x="230" y="226" text-anchor="middle" font-size="9.8" fill="#555555">Correspondance conceptuelle documentée (manuscrit §3.4, non assertée dans l'OWL) :</text>
  <text x="120" y="240" text-anchor="middle" font-size="9.3" fill="#666666">↔ Data Layer</text>
  <text x="340" y="240" text-anchor="middle" font-size="9.3" fill="#666666">↔ VSM Layer</text>
  <text x="120" y="252" text-anchor="middle" font-size="9.3" fill="#666666">↔ SVU Layer (manuscrit)</text>
  <text x="340" y="252" text-anchor="middle" font-size="9.3" fill="#666666">↔ SCOR Layer</text>

  <rect x="20" y="268" width="420" height="52" rx="5" fill="#fafafa" stroke="#999999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="32" y="284" font-size="9.5" font-weight="bold" fill="#555555">Point de vigilance</text>
  <text x="32" y="297" font-size="9.3" fill="#555555">belongsToLayer (domaine scopro:SC_Entity, portée ArchitectureLayer) est déclarée</text>
  <text x="32" y="309" font-size="9.3" fill="#555555">mais jamais utilisée : aucune classe du Core n'est assertée dans une de ces quatre couches.</text>
</svg>
