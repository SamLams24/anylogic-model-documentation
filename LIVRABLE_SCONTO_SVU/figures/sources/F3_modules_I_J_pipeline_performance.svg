<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222222"/>
    </marker>
    <marker id="arrowgrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666"/>
    </marker>
    <marker id="isa" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="2000" height="1500" fill="#ffffff"/>

  <!-- Title -->
  <text x="1000" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">SCONTO-SVU : Modules I et J — référentiel SCOR, pipeline de performance et couche pivot</text>
  <text x="1000" y="45" text-anchor="middle" font-size="12" font-style="italic" fill="#444444">Couvre les apports V4.2/V4.3 du Module I (valeurs, scores, pondérations, grades flous) absents de la Figure 2 — toutes les relations proviennent du Core 4.3.0</text>

  <!-- Column headers -->
  <text x="40" y="78" font-size="14" font-weight="bold">Module J — pivot (détail complet : Figure 2)</text>
  <text x="400" y="78" font-size="14" font-weight="bold">Processus SCOR</text>
  <text x="760" y="78" font-size="14" font-weight="bold">Métriques SCOR — hiérarchie de valeur</text>
  <text x="1300" y="78" font-size="14" font-weight="bold">Attributs de performance et évaluation globale</text>

  <!-- ===================== Module J strip ===================== -->
  <rect x="40" y="96" width="280" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="180" y="128" text-anchor="middle" font-size="13.5" font-weight="bold">MicroActivity</text>

  <rect x="40" y="186" width="280" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <text x="180" y="217" text-anchor="middle" font-size="13" font-weight="bold">NormalizationRule</text>

  <rect x="40" y="278" width="280" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <text x="180" y="309" text-anchor="middle" font-size="13" font-weight="bold">AggregationRule</text>

  <!-- ===================== Bridge corridor (4 lanes, y=100/120/140/160... adapted) ===================== -->
  <!-- lane 1 : mapsToSCORN3 -->
  <polyline points="320,112 530,112 530,258" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="330" y="106" font-size="9.5" fill="#333333">mapsToSCORN3 (MicroActivity → SCORLevel3Process ∪ scopro:Process_Element/Task)</text>

  <!-- lane 2 : feedsSCORMetric -->
  <polyline points="320,130 905,130 905,258" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="330" y="146" font-size="9.5" fill="#333333">feedsSCORMetric (MicroActivity → union SCORMetric/Composite/N1/N2/N3)</text>

  <!-- lane 3 : scoredByRule (reverse, grey dashed) -->
  <polyline points="905,164 180,164 180,184" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowgrey)"/>
  <text x="560" y="178" font-size="9.5" fill="#555555">scoredByRule (métriques SCOR → NormalizationRule)</text>

  <!-- lane 4 : producesMetric -->
  <polyline points="320,304 230,304 230,198 1085,198 1085,338" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="700" y="212" font-size="9.5" fill="#333333">producesMetric (AggregationRule → union, cible : SCORCompositeMetric)</text>

  <!-- ===================== Processes column ===================== -->
  <rect x="440" y="258" width="220" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="550" y="289" text-anchor="middle" font-size="13.5" font-weight="bold">SCORProcess</text>

  <rect x="400" y="338" width="220" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="510" y="362" text-anchor="middle" font-size="12">SCORLevel1Process</text>
  <text x="510" y="375" text-anchor="middle" font-size="8.3" font-style="italic" fill="#666666">⊂ aussi scopro:Business_Process</text>

  <rect x="400" y="392" width="220" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="510" y="416" text-anchor="middle" font-size="12">SCORLevel2Process</text>
  <text x="510" y="429" text-anchor="middle" font-size="8.3" font-style="italic" fill="#666666">⊂ aussi scopro:Business_Process</text>

  <rect x="400" y="446" width="220" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="510" y="470" text-anchor="middle" font-size="12">SCORLevel3Process</text>
  <text x="510" y="483" text-anchor="middle" font-size="7.6" font-style="italic" fill="#666666">⊂ union(scopro:Process_Element, Task)</text>

  <line x1="510" y1="338" x2="530" y2="312" stroke="#222222" stroke-width="1.2" marker-end="url(#isa)"/>
  <line x1="510" y1="392" x2="545" y2="312" stroke="#222222" stroke-width="1.2" marker-end="url(#isa)"/>
  <line x1="510" y1="446" x2="560" y2="312" stroke="#222222" stroke-width="1.2" marker-end="url(#isa)"/>

  <!-- ===================== Metric value hierarchy ===================== -->
  <rect x="810" y="258" width="190" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="905" y="289" text-anchor="middle" font-size="13.5" font-weight="bold">SCORMetric</text>

  <rect x="760" y="338" width="180" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="850" y="364" text-anchor="middle" font-size="12.5">SCORMetricN3</text>

  <rect x="980" y="338" width="210" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="1085" y="358" text-anchor="middle" font-size="12">SCORCompositeMetric</text>
  <text x="1085" y="374" text-anchor="middle" font-size="8" font-style="italic" fill="#666666">⊂ scome:Composite_Metric</text>

  <rect x="760" y="406" width="180" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="850" y="432" text-anchor="middle" font-size="12.5">SCORMetricN2</text>

  <rect x="980" y="406" width="180" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="1070" y="432" text-anchor="middle" font-size="12.5">SCORMetricN1</text>

  <!-- is-a -->
  <line x1="850" y1="338" x2="880" y2="312" stroke="#222222" stroke-width="1.2" marker-end="url(#isa)"/>
  <line x1="850" y1="406" x2="1030" y2="384" stroke="#222222" stroke-width="1.2" marker-end="url(#isa)"/>
  <line x1="1070" y1="406" x2="1045" y2="384" stroke="#222222" stroke-width="1.2" marker-end="url(#isa)"/>

  <!-- isAggregatedInto : SCORMetric -> SCORCompositeMetric -->
  <path d="M 1000,282 C 1060,282 1080,310 1085,336" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="1005" y="318" font-size="9.5" fill="#333333">isAggregatedInto</text>

  <!-- aggregatesTo chain N3->N2->N1 -->
  <line x1="850" y1="382" x2="850" y2="404" stroke="#b33" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="858" y="398" font-size="9.5" fill="#993333">aggregatesTo</text>
  <line x1="940" y1="428" x2="978" y2="428" stroke="#b33" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="945" y="421" font-size="9.5" fill="#993333">aggregatesTo</text>

  <!-- attribute note box for metric value pipeline -->
  <rect x="760" y="468" width="430" height="58" rx="5" fill="#f7f7f7" stroke="#999999" stroke-width="1.1"/>
  <text x="775" y="485" font-size="10" fill="#333333">hasMetricValue, hasPerformanceScore, hasMetricWeight,</text>
  <text x="775" y="500" font-size="10" fill="#333333">isBenefitMetric : xsd:decimal/boolean — domaine en union</text>
  <text x="775" y="515" font-size="10" fill="#333333">(SCORMetric, SCORCompositeMetric, N1, N2, N3) [Module I, V4.2]</text>

  <!-- ===================== Attributes + Evaluation ===================== -->
  <rect x="1330" y="258" width="280" height="52" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="1470" y="283" text-anchor="middle" font-size="12.5" font-weight="bold">SCORPerformanceAttribute</text>
  <text x="1470" y="298" text-anchor="middle" font-size="8" font-style="italic" fill="#666666">⊂ scome:SC_Performance_Concept</text>

  <!-- contributesToPerformanceAttribute : metric family -> SCORPerformanceAttribute -->
  <line x1="1190" y1="274" x2="1328" y2="274" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1198" y="267" font-size="9.5" fill="#333333">contributesToPerformanceAttribute</text>

  <rect x="1300" y="338" width="118" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="1359" y="358" text-anchor="middle" font-size="10.5">Reliability (RL)</text>
  <text x="1359" y="371" text-anchor="middle" font-size="7.3" font-style="italic" fill="#666666">⊂ scome:SC_Reliability</text>

  <rect x="1428" y="338" width="128" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="1492" y="358" text-anchor="middle" font-size="10.5">Responsiveness (RS)</text>
  <text x="1492" y="371" text-anchor="middle" font-size="7.3" font-style="italic" fill="#666666">⊂ scome:SC_Responsiveness</text>

  <rect x="1566" y="338" width="100" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="1616" y="358" text-anchor="middle" font-size="10.5">Agility (AG)</text>
  <text x="1616" y="371" text-anchor="middle" font-size="7.3" font-style="italic" fill="#666666">⊂ scome:SC_Agility</text>

  <rect x="1676" y="338" width="100" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="1726" y="358" text-anchor="middle" font-size="10.5">Cost (CO)</text>
  <text x="1726" y="371" text-anchor="middle" font-size="7.3" font-style="italic" fill="#666666">⊂ scome:SC_Cost</text>

  <rect x="1786" y="338" width="150" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="1861" y="358" text-anchor="middle" font-size="10.5">Asset Management (AM)</text>
  <text x="1861" y="371" text-anchor="middle" font-size="7.3" font-style="italic" fill="#666666">⊂ scome:SC_Assets</text>

  <line x1="1359" y1="338" x2="1430" y2="312" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <line x1="1492" y1="338" x2="1455" y2="312" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <line x1="1616" y1="338" x2="1480" y2="312" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <line x1="1726" y1="338" x2="1505" y2="312" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <line x1="1861" y1="338" x2="1530" y2="312" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>

  <!-- hasAttributeWeight note -->
  <rect x="1330" y="402" width="280" height="40" rx="5" fill="#f7f7f7" stroke="#999999" stroke-width="1.1"/>
  <text x="1345" y="418" font-size="10" fill="#333333">hasAttributeWeight : xsd:decimal</text>
  <text x="1345" y="432" font-size="10" fill="#333333">(domaine SCORPerformanceAttribute)</text>

  <!-- Evaluation -->
  <rect x="1330" y="466" width="280" height="54" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="1470" y="491" text-anchor="middle" font-size="13" font-weight="bold">SCORPerformanceEvaluation</text>
  <text x="1470" y="506" text-anchor="middle" font-size="8.5" fill="#666666">(≈ PI, indice de performance global)</text>

  <!-- contributesToEvaluation routed via left-side channel to avoid specialization row -->
  <polyline points="1330,284 1312,284 1312,493 1328,493" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="1240" y="305" font-size="9.5" fill="#333333">contributesToEvaluation</text>
  <text x="1240" y="318" font-size="8.5" fill="#333333" font-style="italic">(domaine SCORPerformanceAttribute)</text>

  <!-- producesEvaluation : SCORMetricN1 -> Evaluation, dashed alternate path -->
  <path d="M 1160,422 C 1240,430 1300,450 1328,480" fill="none" stroke="#666666" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowgrey)"/>
  <text x="1170" y="450" font-size="9.5" fill="#555555">producesEvaluation (voie directe, depuis N1)</text>

  <!-- external SCOBE box -->
  <rect x="1330" y="556" width="280" height="54" rx="6" fill="#f0f0f0" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="1470" y="579" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444444">scobe:Benchmarking_project</text>
  <text x="1470" y="595" text-anchor="middle" font-size="9" fill="#666666">(ontologie tierce SCOBE, 2014)</text>

  <line x1="1470" y1="520" x2="1470" y2="554" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1480" y="541" font-size="9.5" fill="#333333">rdfs:subClassOf</text>

  <!-- caveat box -->
  <rect x="1330" y="626" width="610" height="150" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="1350" y="648" font-size="12.5" font-weight="bold" fill="#111111">⚠ Point de vigilance — à vérifier, non modifié</text>
  <text x="1350" y="668" font-size="10.5" fill="#222222">Axiome exact (ligne 910 du fichier) :</text>
  <text x="1360" y="684" font-size="10.5" font-family="Consolas, monospace" fill="#222222">:SCORPerformanceEvaluation rdfs:subClassOf scobe:Benchmarking_project .</text>
  <text x="1350" y="706" font-size="10.5" fill="#222222">SCOBE.owl ne déclare que la classe « Benchmarking_Project » (P majuscule).</text>
  <text x="1350" y="722" font-size="10.5" fill="#222222">« Benchmarking_project » (p minuscule) est une IRI distincte, non déclarée</text>
  <text x="1350" y="738" font-size="10.5" fill="#222222">dans SCOBE.owl : l'alignement visé avec la sémantique réelle du</text>
  <text x="1350" y="754" font-size="10.5" fill="#222222">benchmarking SCOBE n'est donc pas établi tel quel (casse RDF significative).</text>

  <!-- ===================== Fuzzy grading ===================== -->
  <text x="800" y="900" font-size="14" font-weight="bold">Grades flous de performance [Module I, V4.3]</text>
  <rect x="940" y="918" width="260" height="54" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="1070" y="942" text-anchor="middle" font-size="13" font-weight="bold">FuzzyPerformanceGradeSet</text>
  <text x="1070" y="958" text-anchor="middle" font-size="8.5" fill="#666666">6 grades : A à F</text>

  <rect x="940" y="988" width="260" height="42" rx="5" fill="#f7f7f7" stroke="#999999" stroke-width="1.1"/>
  <text x="955" y="1006" font-size="10" fill="#333333">hasGradeA … hasGradeF : xsd:decimal</text>
  <text x="955" y="1020" font-size="10" fill="#333333">(6 propriétés datatype, domaine FuzzyPerformanceGradeSet)</text>

  <!-- hasFuzzyGradeSet from SCORMetric, routed below the attribute note box -->
  <polyline points="905,312 905,548 1000,548 1000,916" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="630" y="560" font-size="9.5" fill="#333333">hasFuzzyGradeSet (union : SCORMetric, SCORCompositeMetric, N1, N2, N3,</text>
  <text x="630" y="574" font-size="9.5" fill="#333333">SCORPerformanceAttribute, SCORPerformanceEvaluation)</text>

  <!-- hasFuzzyGradeSet from SCORPerformanceEvaluation, routed via right channel -->
  <polyline points="1330,497 1292,497 1292,944 1202,944" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===================== Legend ===================== -->
  <rect x="40" y="1070" width="1920" height="280" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="60" y="1096" font-size="14" font-weight="bold">Légende</text>

  <line x1="60" y1="1118" x2="100" y2="1118" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="1122" font-size="11.5">propriété objet ou datatype (nom exact du fichier Turtle)</text>

  <line x1="60" y1="1140" x2="100" y2="1140" stroke="#b33" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="1144" font-size="11.5" fill="#333333">chaîne d'agrégation verticale de valeur (aggregatesTo : N3→N2→N1), ajoutée en V4.1</text>

  <line x1="60" y1="1162" x2="100" y2="1162" stroke="#666666" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowgrey)"/>
  <text x="110" y="1166" font-size="11.5">voie alternative documentée par le fichier lui-même (scoredByRule, producesEvaluation) — à ne pas confondre avec la chaîne principale</text>

  <line x1="60" y1="1184" x2="100" y2="1184" stroke="#222222" stroke-width="1.1" marker-end="url(#isa)"/>
  <text x="110" y="1188" font-size="11.5">spécialisation (rdfs:subClassOf)</text>

  <rect x="60" y="1200" width="34" height="20" fill="#f0f0f0" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="110" y="1215" font-size="11.5">classe d'une ontologie tierce (SCOPRO/SCOME/SCOBE), non détaillée ici</text>

  <rect x="60" y="1226" width="34" height="20" fill="#f7f7f7" stroke="#999999" stroke-width="1.1"/>
  <text x="110" y="1241" font-size="11.5">compartiment d'attributs (datatype properties), listées plutôt que dessinées individuellement</text>

  <text x="60" y="1278" font-size="12" font-weight="bold">Ce que le fichier distingue explicitement (rdfs:comment du Module I)</text>
  <text x="60" y="1296" font-size="11" fill="#333333">« Relation de contribution d'un score de métrique vers RL/RS/AG/CO/AM. Elle ne signifie pas une agrégation de valeur physique N3→N1. » — la chaîne de valeur</text>
  <text x="60" y="1312" font-size="11" fill="#333333">(aggregatesTo, rouge) et la chaîne de score/contribution (contributesToPerformanceAttribute → contributesToEvaluation, noir) sont deux mécanismes distincts et coexistants.</text>

  <text x="60" y="1334" font-size="12" font-weight="bold">Limites de représentation</text>
  <text x="60" y="1322" font-size="0"> </text>
  <text x="60" y="1350" font-size="11" fill="#333333">Aucune cardinalité UML n'est indiquée (aucune restriction owl:cardinality/min/max déclarée dans le Core). Les domaines « union de classes » (owl:unionOf) sont signalés en</text>
  <text x="60" y="1326" font-size="0"> </text>
  <text x="60" y="1304" font-size="0"> </text>
  <text x="60" y="1366" font-size="11" fill="#333333">toutes lettres sur chaque flèche concernée plutôt que simplifiés en un domaine unique, pour ne pas suggérer une relation plus simple que celle réellement déclarée.</text>

  <text x="1000" y="1400" text-anchor="middle" font-size="10" fill="#777777">Source : SCONTO_SVU_Core_v4.3.0.ttl, Module I (lignes 770-1076) et Module J (lignes 1077-1265) ; SCOBE.owl pour la vérification de « Benchmarking_Project »</text>
</svg>
