<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,2 L0,4 Z" fill="#222222"/>
    </marker>
    <marker id="arrowgrey" markerWidth="7" markerHeight="7" refX="5.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,2 L0,4 Z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="460" height="640" fill="#ffffff"/>

  <text x="230" y="16" text-anchor="middle" font-size="12.5" font-weight="bold">SCONTO-SVU : organisation générale</text>
  <text x="230" y="27" text-anchor="middle" font-size="8" font-style="italic" fill="#444444">Core et extensions scientifiquement retenues — sens des flèches : importeur → importé</text>

  <!-- Third-party SCONTO ontologies -->
  <rect x="115" y="38" width="230" height="56" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="230" y="49" text-anchor="middle" font-size="7" fill="#555555">Ontologies SCONTO tierces (2014)</text>

  <rect x="126" y="56" width="58" height="26" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="155" y="73" text-anchor="middle" font-size="8.5" font-weight="bold">SCOBE</text>

  <rect x="200" y="56" width="58" height="26" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="229" y="73" text-anchor="middle" font-size="8.5" font-weight="bold">SCOME</text>

  <rect x="274" y="56" width="58" height="26" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="303" y="73" text-anchor="middle" font-size="8.5" font-weight="bold">SCOPRO</text>

  <!-- SCOBE -> SCOME -> SCOPRO (importeur -> importé) -->
  <line x1="184" y1="69" x2="198" y2="69" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="258" y1="69" x2="272" y2="69" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Core -> group (Core importe SCOPRO, SCOME, SCOBE) -->
  <line x1="230" y1="116" x2="230" y2="96" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="236" y="110" font-size="7" fill="#333333">owl:imports</text>
  <text x="236" y="120" font-size="7" fill="#333333">(SCOPRO, SCOME, SCOBE)</text>

  <!-- Core box -->
  <rect x="135" y="122" width="190" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <text x="230" y="142" text-anchor="middle" font-size="11" font-weight="bold">Core SCONTO-SVU</text>
  <text x="230" y="156" text-anchor="middle" font-size="9">v4.3.0</text>
  <text x="230" y="169" text-anchor="middle" font-size="6.3" fill="#555555">ligne courante — 0 classe insatisfaisable (HermiT)</text>

  <!-- Agent -> Core, AER -> Core (importeur -> importé, flèche vers le haut) -->
  <line x1="145" y1="217" x2="195" y2="180" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="325" y1="217" x2="265" y2="180" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="90" y="202" font-size="7" fill="#333333">owl:imports</text>
  <text x="300" y="202" font-size="7" fill="#333333">owl:imports</text>

  <!-- Agent box -->
  <rect x="55" y="219" width="160" height="50" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="135" y="237" text-anchor="middle" font-size="9.5" font-weight="bold">Agent Extension</text>
  <text x="135" y="250" text-anchor="middle" font-size="8">v1.1.2</text>
  <text x="135" y="261" text-anchor="middle" font-size="6" fill="#555555">revalidée avec le Core 4.3.0</text>

  <!-- AER box -->
  <rect x="245" y="219" width="160" height="50" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="325" y="237" text-anchor="middle" font-size="9.5" font-weight="bold">AER Extension</text>
  <text x="325" y="250" text-anchor="middle" font-size="8">v1.1.2</text>
  <text x="325" y="261" text-anchor="middle" font-size="6" fill="#555555">revalidée avec le Core 4.3.0</text>

  <!-- AER -> Agent (importeur -> importé) -->
  <line x1="243" y1="244" x2="217" y2="244" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="222" y="238" text-anchor="middle" font-size="6.3" fill="#333333">owl:imports</text>

  <!-- Older generation zone, three SEPARATE version boxes (not merged) -->
  <rect x="20" y="300" width="420" height="190" rx="6" fill="#fafafa" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="32" y="316" font-size="8" font-weight="bold" fill="#555555">Génération antérieure — non revalidée avec la ligne courante</text>
  <text x="32" y="328" font-size="6.3" fill="#666666">(absence d'alignement et de validation constatée ; aucun test de cohérence conjoint réalisé — aucune incompatibilité affirmée)</text>

  <rect x="40" y="340" width="120" height="32" rx="4" fill="#e8e8e8" stroke="#777777" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="100" y="360" text-anchor="middle" font-size="8" fill="#444444">Core v4.1.0</text>

  <rect x="170" y="340" width="120" height="32" rx="4" fill="#e8e8e8" stroke="#777777" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="230" y="360" text-anchor="middle" font-size="8" fill="#444444">Agent v1.0.0</text>

  <rect x="300" y="340" width="120" height="32" rx="4" fill="#e8e8e8" stroke="#777777" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="360" y="360" text-anchor="middle" font-size="8" fill="#444444">AER v1.0.0</text>

  <!-- Forecast/MTS box -->
  <rect x="40" y="420" width="160" height="56" rx="5" fill="#f2f2f2" stroke="#555555" stroke-width="1.2"/>
  <text x="120" y="441" text-anchor="middle" font-size="9" font-weight="bold">Forecast / MTS</text>
  <text x="120" y="454" text-anchor="middle" font-size="7.5">v1.0.0</text>
  <text x="120" y="466" text-anchor="middle" font-size="6" fill="#555555">chapitre expérimental</text>

  <!-- ISA-95 box -->
  <rect x="250" y="420" width="150" height="56" rx="5" fill="#f2f2f2" stroke="#555555" stroke-width="1.2"/>
  <text x="325" y="441" text-anchor="middle" font-size="9" font-weight="bold">ISA-95</text>
  <text x="325" y="454" text-anchor="middle" font-size="7.5">v1.0.0</text>
  <text x="325" y="466" text-anchor="middle" font-size="6" fill="#555555">chapitre 4</text>

  <!-- Forecast/MTS -> Core v4.1.0, Agent v1.0.0, AER v1.0.0 (3 imports) -->
  <line x1="90" y1="418" x2="100" y2="374" stroke="#555555" stroke-width="1.1" marker-end="url(#arrowgrey)"/>
  <line x1="130" y1="418" x2="220" y2="374" stroke="#555555" stroke-width="1.1" marker-end="url(#arrowgrey)"/>
  <line x1="150" y1="418" x2="345" y2="374" stroke="#555555" stroke-width="1.1" marker-end="url(#arrowgrey)"/>
  <text x="40" y="408" font-size="6" fill="#555555">owl:imports ×3 (Core 4.1.0, Agent 1.0.0, AER 1.0.0)</text>

  <!-- ISA-95 -> Core v4.1.0 ONLY -->
  <line x1="300" y1="418" x2="130" y2="368" stroke="#555555" stroke-width="1.1" marker-end="url(#arrowgrey)"/>
  <text x="330" y="408" font-size="6" fill="#555555">owl:imports (Core 4.1.0 seul)</text>

  <!-- Legend -->
  <rect x="20" y="500" width="420" height="124" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="32" y="516" font-size="9" font-weight="bold">Légende</text>

  <line x1="32" y1="530" x2="60" y2="530" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="66" y="533" font-size="7">owl:imports — la flèche va de l'ontologie IMPORTEUSE vers l'ontologie IMPORTÉE</text>

  <rect x="32" y="542" width="24" height="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="66" y="552" font-size="7">composant de la ligne courante (Core 4.3.0, Agent/AER 1.1.2)</text>

  <rect x="32" y="560" width="24" height="14" fill="#e8e8e8" stroke="#777777" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="66" y="570" font-size="7">version antérieure, non revalidée (Core 4.1.0 / Agent 1.0.0 / AER 1.0.0)</text>

  <text x="32" y="590" font-size="7" fill="#333333">Table de contrôle exhaustive des sens de flèche (IRI importeur/importée,</text>
  <text x="32" y="602" font-size="7" fill="#333333">conformité) : TABLE_CONTROLE_IMPORTS.md. Détail complet : registre_figures.md.</text>

  <text x="230" y="632" text-anchor="middle" font-size="6.3" font-style="italic" fill="#777777">Sources : SCONTO_SVU_Core_v4.3.0.ttl ; Agent/AER_Extension_v1.1.2.ttl ; forecast-mts-extension_1.ttl ; isa95-extension-v1.0.ttl ; SCOPRO/SCOME/SCOBE.owl</text>
</svg>
