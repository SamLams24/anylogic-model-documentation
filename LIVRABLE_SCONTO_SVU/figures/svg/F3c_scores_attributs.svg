<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,2 L0,4 Z" fill="#222222"/>
    </marker>
    <marker id="arrowgrey" markerWidth="7" markerHeight="7" refX="5.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,2 L0,4 Z" fill="#666666"/>
    </marker>
    <marker id="isa" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.5,4 L0,8 Z" fill="#ffffff" stroke="#222222" stroke-width="0.9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="460" height="580" fill="#ffffff"/>

  <text x="230" y="16" text-anchor="middle" font-size="12.5" font-weight="bold">Figure 3c — Scores, attributs et évaluation globale (Module I)</text>
  <text x="230" y="27" text-anchor="middle" font-size="8" font-style="italic" fill="#444444">Chaîne de score/contribution, distincte de la chaîne de valeur (Figure 3b)</text>

  <rect x="130" y="38" width="200" height="26" rx="4" fill="#fafafa" stroke="#999999" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="230" y="55" text-anchor="middle" font-size="9" font-style="italic" fill="#666666">Métriques SCOR (N1/N2/N3/Composite)</text>

  <rect x="30" y="92" width="400" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="230" y="113" text-anchor="middle" font-size="9" font-weight="bold">SCORPerformanceAttribute</text>

  <line x1="230" y1="64" x2="230" y2="90" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="236" y="80" font-size="8.5" fill="#333333">contributesToPerformanceAttribute</text>

  <rect x="30" y="150" width="76" height="34" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <text x="68" y="165" text-anchor="middle" font-size="9" font-weight="bold">Reliability</text>
  <text x="68" y="176" text-anchor="middle" font-size="8">(RL)</text>

  <rect x="114" y="150" width="90" height="34" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <text x="159" y="165" text-anchor="middle" font-size="9" font-weight="bold">Responsiveness</text>
  <text x="159" y="176" text-anchor="middle" font-size="8">(RS)</text>

  <rect x="212" y="150" width="70" height="34" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <text x="247" y="165" text-anchor="middle" font-size="9" font-weight="bold">Agility</text>
  <text x="247" y="176" text-anchor="middle" font-size="8">(AG)</text>

  <rect x="290" y="150" width="66" height="34" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <text x="323" y="165" text-anchor="middle" font-size="9" font-weight="bold">Cost</text>
  <text x="323" y="176" text-anchor="middle" font-size="8">(CO)</text>

  <rect x="364" y="150" width="66" height="34" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.1"/>
  <text x="397" y="163" text-anchor="middle" font-size="8.3">Asset Mgmt</text>
  <text x="397" y="174" text-anchor="middle" font-size="8">(AM)</text>

  <line x1="68" y1="150" x2="150" y2="128" stroke="#222222" stroke-width="1" marker-end="url(#isa)"/>
  <line x1="159" y1="150" x2="195" y2="128" stroke="#222222" stroke-width="1" marker-end="url(#isa)"/>
  <line x1="247" y1="150" x2="250" y2="128" stroke="#222222" stroke-width="1" marker-end="url(#isa)"/>
  <line x1="323" y1="150" x2="290" y2="128" stroke="#222222" stroke-width="1" marker-end="url(#isa)"/>
  <line x1="397" y1="150" x2="320" y2="128" stroke="#222222" stroke-width="1" marker-end="url(#isa)"/>

  <rect x="30" y="198" width="400" height="40" rx="4" fill="#f7f7f7" stroke="#999999" stroke-width="0.9"/>
  <text x="40" y="212" font-size="8.5" fill="#555555">contributesToPerformanceAttribute : domaine en union (5 classes de métrique).</text>
  <text x="40" y="224" font-size="8.5" fill="#555555">Chaque attribut ⊂ aussi une classe scome: propre — voir matrice des relations.</text>
  <text x="40" y="234" font-size="8.5" fill="#555555">hasAttributeWeight : xsd:decimal (domaine SCORPerformanceAttribute).</text>

  <rect x="140" y="252" width="180" height="40" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="230" y="270" text-anchor="middle" font-size="9" font-weight="bold">SCORPerformanceEvaluation <tspan font-weight="normal" fill="#aa3333">(¹)</tspan></text>
  <text x="230" y="283" text-anchor="middle" font-size="8.2" fill="#666666">(≈ PI, indice global)</text>

  <polyline points="430,109 430,270 322,270" fill="none" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="436" y="190" font-size="8.3" fill="#333333" transform="rotate(-90 436,190)">contributesToEvaluation</text>

  <rect x="30" y="38" width="90" height="20" rx="4" fill="#fafafa" stroke="#999999" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="75" y="52" text-anchor="middle" font-size="8.3" font-style="italic" fill="#666666">N1 (cf. 3b)</text>
  <polyline points="75,58 15,110 15,250 138,260" fill="none" stroke="#666666" stroke-width="1.1" stroke-dasharray="5,3" marker-end="url(#arrowgrey)"/>
  <text x="8" y="180" text-anchor="middle" font-size="8.3" fill="#555555" transform="rotate(-90 8,180)">producesEvaluation</text>

  <!-- Fuzzy grading -->
  <text x="20" y="316" font-size="9" font-weight="bold">Grades flous [V4.3]</text>
  <rect x="145" y="324" width="170" height="36" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="230" y="344" text-anchor="middle" font-size="9" font-weight="bold">FuzzyPerformanceGradeSet</text>
  <text x="230" y="356" text-anchor="middle" font-size="8.3" fill="#666666">6 grades : A à F</text>

  <rect x="30" y="374" width="400" height="30" rx="4" fill="#f7f7f7" stroke="#999999" stroke-width="0.9"/>
  <text x="40" y="386" font-size="8.5" fill="#555555">hasFuzzyGradeSet : domaine en union (toute métrique, SCORPerformanceAttribute,</text>
  <text x="40" y="397" font-size="8.5" fill="#555555">SCORPerformanceEvaluation). hasGradeA…F : xsd:decimal (6 propriétés).</text>

  <!-- Legend -->
  <rect x="30" y="418" width="400" height="150" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="42" y="434" font-size="8.5" font-weight="bold">Légende</text>
  <line x1="42" y1="447" x2="66" y2="447" stroke="#222222" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="72" y="450" font-size="8.7">propriété — chaîne de score/contribution (≠ aggregatesTo, Figure 3b)</text>
  <line x1="42" y1="462" x2="66" y2="462" stroke="#666666" stroke-width="1.1" stroke-dasharray="5,3" marker-end="url(#arrowgrey)"/>
  <text x="72" y="465" font-size="8.7">voie alternative documentée (producesEvaluation, depuis N1)</text>
  <line x1="42" y1="477" x2="66" y2="477" stroke="#222222" stroke-width="1" marker-end="url(#isa)"/>
  <text x="72" y="480" font-size="8.7">spécialisation (rdfs:subClassOf)</text>
  <text x="42" y="498" font-size="8.5" fill="#333333">Le fichier distingue explicitement (rdfs:comment du Module I) cette chaîne de</text>
  <text x="42" y="510" font-size="8.5" fill="#333333">celle de la Figure 3b : « ne signifie pas une agrégation de valeur physique ».</text>
  <text x="42" y="527" font-size="8.3" fill="#aa3333">(¹) Alignement avec scobe:Benchmarking_project non résolu, volontairement non</text>
  <text x="42" y="538" font-size="8.3" fill="#aa3333">représenté ici — voir NOTE_TECHNIQUE_ANOMALIE_SCOBE.md.</text>
  <text x="42" y="556" font-size="8" font-style="italic" fill="#777777">Source : SCONTO_SVU_Core_v4.3.0.ttl, Module I — précédent : Figure 3b</text>
</svg>
